<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo de Frase Exacta: una tecla de teclado con la F de «Frase» y un cursor parpadeando. -->
  <defs>
    <!-- Fondo azul noche. -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <!-- Lados de la tecla: de coral a ámbar. -->
    <linearGradient id="tecla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6f5b"/>
      <stop offset="1" stop-color="#f7bd4f"/>
    </linearGradient>
    <!-- Cara de arriba de la tecla, más clara. -->
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59a"/>
      <stop offset="1" stop-color="#ff9f6e"/>
    </linearGradient>
    <!-- Brillo suave detrás de la tecla. -->
    <radialGradient id="brillo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Cuadrado con esquinas redondeadas. -->
  <rect width="512" height="512" rx="116" fill="url(#fondo)"/>
  <!-- Brillo. -->
  <circle cx="256" cy="240" r="230" fill="url(#brillo)"/>
  <!-- Sombra de la tecla. -->
  <rect x="104" y="128" width="304" height="292" rx="62" fill="#0b0c12" opacity="0.55"/>
  <!-- Cuerpo de la tecla. -->
  <rect x="96" y="96" width="320" height="300" rx="64" fill="url(#tecla)"/>
  <!-- Cara de arriba. -->
  <rect x="128" y="116" width="256" height="226" rx="44" fill="url(#cara)"/>
  <!-- Letra F (palo, brazo de arriba y brazo del medio). -->
  <g fill="#2a1a10">
    <rect x="190" y="160" width="40" height="142" rx="10"/>
    <rect x="190" y="160" width="118" height="38" rx="10"/>
    <rect x="190" y="218" width="90" height="34" rx="10"/>
  </g>
  <!-- Cursor. -->
  <rect x="294" y="270" width="54" height="32" rx="8" fill="#2a1a10" opacity="0.85"/>
</svg>
