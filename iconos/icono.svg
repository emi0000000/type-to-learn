<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de Frase Exacta: un corazón (las vidas) sobre un cursor de máquina de escribir. -->
  <defs>
    <!-- Fondo oscuro con un degradado suave. -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a3a"/>
      <stop offset="1" stop-color="#101117"/>
    </linearGradient>
    <!-- Corazón de coral a rojo. -->
    <linearGradient id="corazon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9370"/>
      <stop offset="1" stop-color="#ff5848"/>
    </linearGradient>
  </defs>
  <!-- Cuadrado con esquinas redondeadas. -->
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- Corazón. -->
  <path transform="translate(96 50) scale(13.33)" fill="url(#corazon)" d="M12 21s-7.4-4.5-9.6-9.1C.8 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 6 3.9 4.4 7.4C19.4 16.5 12 21 12 21z"/>
  <!-- Cursor ámbar. -->
  <rect x="176" y="372" width="160" height="28" rx="14" fill="#f7bd4f"/>
</svg>
